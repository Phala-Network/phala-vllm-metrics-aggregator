name: Publish metrics aggregator
on:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v') && !github.event.release.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test exact source
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m unittest discover -s .
      - name: Identify source and release
        id: identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/phala-network/metrics-aggregator:${{ steps.identity.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/Phala-Network/phala-vllm-metrics-aggregator
            org.opencontainers.image.revision=${{ steps.identity.outputs.revision }}
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
      - name: Published identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Published digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"
